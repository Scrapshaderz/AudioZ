name: Windows-Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(AudioZ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: CMake konfigurieren
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Tests der Kern-Bibliothek
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Installer (Setup.exe) erzeugen
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceExe=..\build\src\app\AudioZ_artefacts\Release\AudioZ.exe" `
            installer\AudioZ.iss

      - name: Setup.exe als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AudioZ-Setup
          path: dist/AudioZ-Setup-*.exe
          if-no-files-found: error

      - name: Release erstellen (nur bei Tags wie v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioZ-Setup-*.exe
          generate_release_notes: true
